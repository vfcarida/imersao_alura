[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard_salarios_dados"
version = "2.0.0"
description = "Dashboard interativo e escalável para análise de salários na área de dados."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "streamlit==1.44.1",
    "plotly==5.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "flake8==7.0.0",
    "black==24.3.0",
]

[tool.setuptools]
packages = ["src", "src.components"]

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]

[tool.black]
line-length = 88
